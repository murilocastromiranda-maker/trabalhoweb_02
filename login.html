<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Entrar | Barbearia Camaradas</title>
</head>
<body class="pagina-acesso">
  <div class="cartao-acesso">
    <header>
      <div class="marca">Barbearia <span>Camaradas</span></div>
      <p>Acesse a agenda da barbearia</p>
    </header>
    <div class="corpo">

      <form action="agenda.html" method="get">
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="voce@exemplo.com">
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-principal btn-bloco">Entrar</button>
      </form>
      <p class="rodape-acesso"><a href="index.html">Voltar ao início</a> · Ainda não tem conta? <a href="cadastro.html">Criar cadastro</a></p>
    </div>
  </div>
</body>
</html>
