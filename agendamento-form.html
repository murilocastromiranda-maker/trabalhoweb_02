<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
<title>Agendamento | Barbearia Camaradas</title>
</head>
<body>
<header class="topo">
  <div class="topo-conteudo">
    <a class="marca" href="agenda.html">Barbearia <span>Camaradas</span></a>
    <nav aria-label="Principal">
      <a href="agenda.html">Agendamentos</a>
      <a href="barbeiros.html">Barbeiros</a>
      <span class="usuario">Olá, Maria</span>
      <a href="index.html" class="btn btn-contorno btn-pequeno">Sair</a>
    </nav>
  </div>
</header>
<main>
  <div class="cabecalho-pagina">
    <div>
      <h1>Novo agendamento</h1>
      <p>Informe o cliente, o serviço e o horário.</p>
    </div>
  </div>

  <div class="caixa form-caixa">
    <form action="agenda.html" method="get">
      <input type="hidden" name="id" value="">

      <div class="campo">
        <label for="cliente">Nome do cliente</label>
        <input type="text" id="cliente" name="cliente" required>
      </div>

      <div class="campo">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(43) 99999-9999" required>
      </div>

      <div class="linha-2">
        <div class="campo">
          <label for="servico">Serviço</label>
          <select id="servico" name="servico" required>
            <option value="">Selecione</option>
            <option>Corte</option>
            <option>Barba</option>
            <option>Corte + barba</option>
            <option>Sobrancelha</option>
          </select>
        </div>
        <div class="campo">
          <label for="valor">Valor (R$)</label>
          <input type="number" id="valor" name="valor" min="0" step="0.01" required>
        </div>
      </div>

      <div class="campo">
        <label for="barbeiro_id">Barbeiro</label>
        <select id="barbeiro_id" name="barbeiro_id" required>
          <option value="">Selecione o barbeiro</option>
          <option value="1">Murilo (degradê)</option>
          <option value="2">Bryan (social)</option>
          <option value="3">Pedro (barba e bigode)</option>
        </select>
      </div>

      <div class="linha-2">
        <div class="campo">
          <label for="data">Data</label>
          <input type="date" id="data" name="data" required>
        </div>
        <div class="campo">
          <label for="hora">Hora</label>
          <input type="time" id="hora" name="hora" required>
        </div>
      </div>

      <div class="form-botoes">
        <button type="submit" class="btn btn-principal">Salvar agendamento</button>
        <a href="agenda.html" class="btn btn-contorno">Cancelar</a>
      </div>
    </form>
  </div>
</main>
<footer class="rodape">Barbearia Camaradas · Projeto full-stack</footer>
</body>
</html>
